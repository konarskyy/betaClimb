services:
  db:
    image: postgres:16-alpine
    container_name: betaclimb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: betaclimb
      POSTGRES_PASSWORD: betaclimb
      POSTGRES_DB: betaclimb
    ports:
      - "5432:5432"
    volumes:
      - betaclimb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betaclimb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  betaclimb-db-data:
